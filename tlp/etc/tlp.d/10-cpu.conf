
# ============================================================
# CPU / thermal block - added 2026-08-19
# Target: i7-10510U 15W, intel_pstate active, HWP+EPP
# Revert: delete everything below this header, then `sudo tlp start`
# ============================================================

# intel_pstate active: "powersave" lets HWP/EPP arbitrate.
# "performance" pins min_perf_pct=100, causing high thermals.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# EPP: balance_performance ramps to turbo on bursts, decays fast.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
# On battery: max power saving, autonomy first.
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Turbo on AC for burst responsiveness, off on BAT.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# HWP dynamic boost: transient min_perf bump on task wake. AC only.
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Perf range (%). If thermals persist, drop MAX_PERF_ON_AC to 80.
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
# BAT: 50% caps around 2.2-2.4 GHz, no turbo.
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=50

# ACPI platform profile: drives EC fan curve and DPTF limits.
# "balanced" keeps EC thermal target lower than "performance".
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# RX 640 runtime PM: auto-suspend when idle (default "on" pins D0 at ~61 C).
RUNTIME_PM_ON_AC=auto
