transition-length = 400
transition-pow-x = 0.1
transition-pow-y = 0.1
transition-pow-w = 0.1
transition-pow-h = 0.1
size-transition = true

corner-radius = 0;
rounded-corners-exclude = [
];
round-borders = 1;
round-borders-exclude = [
];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
no-dock-shadow = false
no-dnd-shadow = false
shadow-exclude = [
		"class_g = 'polybar'",
		"class_g = 'waterfox'",
    	"window_type = 'menu'",
		"class_g = 'Rofi'",
		"_GTK_FRAME_EXTENTS@:c",
];

fading = true;
fade-delta = 10;
fade-in-step = 0.025
fade-out-step = 0.025
fade-exclude = [
		"class_g = 'slop'",   # maim
]

inactive-opacity = 0.7;
frame-opacity = 0.7;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
	"class_g = 'Google-chrome'",
	"class_g = 'waterfox'"
];

opacity-rule = [
		"80:class_g     = 'Polybar'",
];

blur: {
			  method = "dual_kawase";
			  strength = 5;
			  background = false;
			  background-frame = false;
			  background-fixed = false;
	  }

# prevents picom from blurring the background when taking selection screenshot with maim
# https://github.com/naelstrof/maim/issues/130
blur-background-exclude = [
		"class_g = 'waterfox'",
    	"window_type = 'menu'",
		"class_g = 'Rofi'",
		"_GTK_FRAME_EXTENTS@:c",
];

experimental-backends = true;
backend = "glx";

vsync = true
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true
detect-client-leader = true

# use-damage was causing black semi-opaque rectangles on terminal open;
# setting to false fixed it, re-enabled after update
use-damage = true

log-level = "warn";

wintypes:
{
};
